<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page - Travel Goals</title>
    <link rel="stylesheet" href="btap2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">TRAVEL GOALS</div>
        <nav>
            <a href="#">Destinations</a>
            <a href="#">About</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>JOE'S TRAVEL PAGE</h1>
                <p>LET'S EXPLORE THE WORLD TOGETHER!</p>
                <a href="#" class="btn-discover">Discover places</a>
            </div>
        </section>

        <section class="highlights">
            <h2>HIGHLIGHTS</h2>
            <div class="cards-container">
                <div class="card">
                    <img src="miami.jpg" alt="Miami">
                    <p class="location-name">MIAMI <span class="country">USA</span></p>
                </div>
                <div class="card">
                    <img src="munich.jpg" alt="Munich">
                    <p class="location-name">MUNICH <span class="country">GERMANY</span></p>
                </div>
                <div class="card">
                    <img src="barcelona.jpg" alt="Barcelona">
                    <p class="location-name">BARCELONA <span class="country">SPAIN</span></p>
                </div>
                <div class="card">
                    <img src="tokyo.jpg" alt="Tokyo">
                    <p class="location-name">Tokyo <span class="country">Japan</span></p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="social-icons">
            <a href="#">
                <img src="insta.png" alt="Icon 1" class="footer-img">
            </a>
            <a href="#">
                <img src="facebook.png" alt="Icon 2" class="footer-img">
            </a>
        </div>
    </footer>

</body>
</html>
