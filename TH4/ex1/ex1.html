<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý điểm sinh viên</title>
    <link rel="stylesheet" href="ex1.css">
</head>
<body>

    <h2>Quản Lý Điểm Sinh Viên</h2>

    <div class="form-container">
        <div class="form-group">
            <label for="hoTen">Họ tên:</label>
            <input type="text" id="hoTen" placeholder="Nhập họ tên...">
        </div>
        <div class="form-group">
            <label for="diem">Điểm (0-10):</label>
            <input type="number" id="diem" min="0" max="10" step="0.1" placeholder="Nhập điểm...">
        </div>
        <button id="btnThem">Thêm Sinh Viên</button>
    </div>

    <div class="filter-container">
        <label for="searchName">Tìm kiếm:</label>
        <input type="text" id="searchName" placeholder="Gõ tên cần tìm...">

        <label for="filterXepLoai" style="margin-left: 20px;">Lọc theo xếp loại:</label>
        <select id="filterXepLoai">
            <option value="Tất cả">Tất cả</option>
            <option value="Giỏi">Giỏi</option>
            <option value="Khá">Khá</option>
            <option value="Trung bình">Trung bình</option>
            <option value="Yếu">Yếu</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Họ tên</th>
                <th id="colDiem" class="sortable-col" title="Bấm để sắp xếp">Điểm ▲▼</th>
                <th>Xếp loại</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody id="dsSinhVien">
            </tbody>
    </table>

    <div class="stats">
        <p>Tổng số sinh viên hiển thị: <span id="tongSV">0</span></p>
        <p>Điểm trung bình: <span id="diemTB">0.0</span></p>
    </div>

    <script src="ex1.js"></script>
</body>
</html>
